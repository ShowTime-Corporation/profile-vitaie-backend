# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:eventsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

security.jwt.secret=df84c8a66d8ebf8a27c03e826606d9cb7faf17c63c8f61498a0d732c1d001725
security.jwt.expiration=3600000

# =====================
# ACTUATOR
# =====================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=when_authorized

# =====================
# PROMETHEUS
# =====================
management.metrics.export.prometheus.enabled=true

# =====================
# METRICS TAGS (IMPORTANTES)
# =====================
management.metrics.tags.application=profile-vitaile
management.metrics.tags.env=dev
