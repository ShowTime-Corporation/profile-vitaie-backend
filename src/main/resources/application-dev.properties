
# JPA/Hibernate Configuration
# ---------------------------------------------
# CAMBIO CLAVE 1: Configurar Hibernate para CREAR las tablas
spring.jpa.hibernate.ddl-auto=update 
# Nota: 'create' o 'create-drop' borrarían los datos en cada inicio.
# 'update' intentará crear las tablas que faltan.

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# FLYWAY
# ---------------------------------------------
# CAMBIO CLAVE 2: Deshabilitar Flyway
spring.flyway.enabled=false


# =====================
# ACTUATOR / PROMETHEUS / VERTEX AI (Sin cambios)
# =====================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=profile-vitaile
management.metrics.tags.env=dev

spring.ai.vertex.ai.gemini.project-id={}
spring.ai.vertex.ai.gemini.location=us-central1
spring.ai.vertex.ai.gemini.model=gemini-1.5-pro
